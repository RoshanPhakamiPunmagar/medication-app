<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${user.userId == null ? 'Add User' : 'Edit User'}">User Form</title>
  <style>
    label, input, select, button { display: block; margin: 8px 0; }
  </style>
</head>
<body>

<h2 th:text="${user.userId == null ? 'Add User' : 'Edit User'}"></h2>

<form th:action="@{/admin/users/save}" th:object="${user}" method="post">
  <input type="hidden" th:field="*{userId}" />

  <label for="email">Email:</label>
  <input type="email" id="email" th:field="*{email}" required />

  <label for="name">Name:</label>
  <input type="text" id="name" th:field="*{name}" required />

  <label for="roleId">Role:</label>
  <select id="roleId" th:field="*{roleId}">
    <option value="1">Admin</option>
    <option value="2">Carer</option>
    <option value="3">Client</option>
  </select>

  <label for="password">
    Password:
    <small th:if="${user.userId != null}">(Leave blank to keep current)</small>
  </label>
  <input type="password" id="password" th:field="*{password}" th:placeholder="${user.userId != null ? 'Leave blank to keep current' : ''}" />

  <button type="submit">Save</button>
</form>

</body>
</html>
