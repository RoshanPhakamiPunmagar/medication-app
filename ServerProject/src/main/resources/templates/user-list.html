<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>User List</title></head>
<body>
<h2>User Management</h2>
<a href="/admin/users/add">Add New User</a>
<table border="1">
  <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr>
  <tr th:each="user : ${users}">
    <td th:text="${user.userId}"></td>
    <td th:text="${user.name}"></td>
    <td th:text="${user.email}"></td>
    <td th:text="${user.roleId}"></td>
    <td>
      <a th:href="@{/admin/users/edit/{id}(id=${user.userId})}">Edit</a> |
      <a th:href="@{/admin/users/delete/{id}(id=${user.userId})}" onclick="return confirm('Are you sure?')">Delete</a>
    </td>
  </tr>
</table>
</body>
</html>
