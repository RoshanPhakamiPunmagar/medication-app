<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 40px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .nav-link {
      display: inline-block;
      margin: 20px;
      text-decoration: none;
      font-weight: bold;
      color: #007bff;
    }

    .add-button {
      display: block;
      width: fit-content;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }

    .add-button:hover {
      background-color: #0056b3;
    }

    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px 15px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .actions a {
      margin-right: 10px;
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      color: white;
    }

    .actions .edit {
      background-color: #28a745;
    }

    .actions .edit:hover {
      background-color: #218838;
    }

    .actions .delete {
      background-color: #dc3545;
    }

    .actions .delete:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>

<a th:href="@{/dashboard}" class="nav-link">← Back to Dashboard</a>

<h2>User Management</h2>

<a th:href="@{/admin/users/add}" class="add-button">➕ Add User</a>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Role</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="user : ${users}">
    <td th:text="${user.userId}"></td>
    <td th:text="${user.name}"></td>
    <td th:text="${user.email}"></td>

    <td>
        <span th:switch="${user.roleId}">
          <span th:case="2">Carer</span>
        </span>
    </td>

    <td class="actions">
      <a th:if="${user.roleId == 2}" th:href="@{/admin/users/edit/{id}(id=${user.userId})}" class="edit">Edit</a>
      <a th:if="${user.roleId == 2}"
         th:href="@{/admin/users/delete/{id}(id=${user.userId})}"
         class="delete"
         onclick="return confirm('Are you sure you want to delete this user?')">
        Delete
      </a>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
