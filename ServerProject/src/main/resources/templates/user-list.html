<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>User List</title>
</head>
<body>
<h2>All Users</h2>
<a th:href="@{/admin/users/add}">Add User</a>
<table>
  <tr>
    <th>ID</th><th>Name</th><th>Email</th><th>Role ID</th><th>Actions</th>
  </tr>
  <tr th:each="user : ${users}">
    <td th:text="${user.userId}"></td>
    <td th:text="${user.name}"></td>
    <td th:text="${user.email}"></td>
    <td th:text="${user.roleId}"></td>
    <td>
      <a th:href="@{/admin/users/edit/{id}(id=${user.userId})}">Edit</a>
      |
      <a th:href="@{/admin/users/delete/{id}(id=${user.userId})}"
         onclick="return confirm('Are you sure?')">Delete</a>
    </td>
  </tr>
</table>
</body>
</html>
